# ============================================================================
# PRODUCTION PROFILE
#
# Activate with SPRING_PROFILES_ACTIVE=prod.
#
# THIS FILE CONTAINS NO SECRETS AND MUST NEVER CONTAIN ANY. It ships inside the jar.
# Every sensitive value below is a ${ENV_VAR} placeholder with no default, which means a
# missing one fails at STARTUP naming the property rather than at the first request that
# reads it. That is the whole reason there are no fallbacks here - a default is how a
# production box quietly runs on a development secret.
# ============================================================================

# ---------------------------------------------------------------- database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool. The default of 10 is usually right; what matters is that it is stated,
# because Phase 1.4's bug - a 30s AI call inside a transaction - was a pool exhaustion
# incident waiting to happen and nobody could have told you the pool size from the config.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
# Fail a request that cannot get a connection in 10s rather than parking the thread.
spring.datasource.hikari.connection-timeout=10000
# Below Hikari's default of 30 minutes, and below almost every proxy's idle timeout, so
# connections are recycled before something upstream silently closes them.
spring.datasource.hikari.max-lifetime=1200000

# ---------------------------------------------------------------- JPA
# NEVER `update` here. Hibernate's schema updater will happily add a column mid-deploy and
# will never tell you it disagreed with your migration. `validate` fails fast on drift.
#
# BLOCKER: this requires the schema to already exist and to match the entities.
spring.jpa.hibernate.ddl-auto=validate

# show-sql prints bound parameters, which on this app means emails and resume filenames on
# stdout - straight into the log aggregator. Off, permanently.
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------------------------------------------------------------- secrets
# Generate with: openssl rand -base64 48
# Rotating this logs every user out; that is the intended behaviour, not a side effect.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}

groq.api.key=${GROQ_API_KEY}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.api.model=${GROQ_API_MODEL:llama-3.3-70b-versatile}

groq.resume.api.key=${GROQ_RESUME_API_KEY}
groq.resume.api.url=${GROQ_RESUME_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.resume.api.model=${GROQ_RESUME_API_MODEL:llama-3.3-70b-versatile}

# ---------------------------------------------------------------- app
file.upload-dir=${UPLOAD_DIR}
app.generation.free-limit=${FREE_GENERATION_LIMIT:3}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ---------------------------------------------------------------- supabase storage
supabase.url=${SUPABASE_URL:https://fkthyogkozhpwqoygqth.supabase.co}
supabase.secret-key=${SUPABASE_SECRET_KEY}
supabase.bucket=${SUPABASE_BUCKET:careerPilot_resumes}

# TLS is assumed in production. A Secure cookie is not stored over plain http, so if this
# is true and you are serving http, login returns 200 and every refresh returns 401.
app.cookie.secure=true
app.cookie.same-site=Strict

# The app is behind a load balancer that overwrites X-Forwarded-For. If that is NOT true
# of your deployment, set this to false - a client-supplied XFF means every request looks
# like a new client and rate limiting never fires at all.
app.rate-limit.trust-forwarded-headers=${TRUST_FORWARDED_HEADERS:true}
server.forward-headers-strategy=FRAMEWORK

# ---------------------------------------------------------------- API docs
# An OpenAPI document is a complete map of the API surface handed to anyone who asks.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ---------------------------------------------------------------- logging
# Structured JSON on stdout (Elastic Common Schema). Built into Spring Boot 3.4+, so no
# logstash-logback-encoder and no logback-spring.xml to maintain.
#
# This is what makes the MDC useful: requestId and userId become queryable FIELDS rather
# than text inside a message string, so "every line for this request" is a filter instead
# of a regex. Plain-text logs keep them too (see logging.pattern.level) but only a human
# can read those.
logging.structured.format.console=ecs
logging.level.root=INFO
logging.level.com.careerplatform=INFO
# Hibernate's binder logs parameter values - emails, filenames. Never raise this in prod.
logging.level.org.hibernate.orm.jdbc.bind=OFF

# ---------------------------------------------------------------- actuator
# Bind the management port to the loopback/pod-internal interface. If your scraper runs
# outside the pod network you will need to widen this - do it deliberately and with a
# firewall rule, not by deleting the line.
management.server.address=${MANAGEMENT_BIND_ADDRESS:127.0.0.1}
management.endpoint.health.show-details=never

# ---------------------------------------------------------------- errors
server.error.include-stacktrace=never
server.error.include-message=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
