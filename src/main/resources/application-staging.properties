# ============================================================================
# STAGING PROFILE
#
# Deliberately almost identical to prod. A staging environment that differs from
# production in its configuration tests a system that does not exist - the value of
# staging is that the differences are ONLY the ones listed here:
#
#   1. Swagger UI is on, so the API is explorable.
#   2. Application logging is DEBUG.
#   3. Health details are visible.
#
# Schema handling, cookie flags, secret sourcing and structured logging are the same as
# prod on purpose. Those are exactly the settings whose failure modes you want to
# discover here rather than there.
# ============================================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}

groq.api.key=${GROQ_API_KEY}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.api.model=${GROQ_API_MODEL:llama-3.3-70b-versatile}
groq.resume.api.key=${GROQ_RESUME_API_KEY}
groq.resume.api.url=${GROQ_RESUME_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.resume.api.model=${GROQ_RESUME_API_MODEL:llama-3.3-70b-versatile}

file.upload-dir=${UPLOAD_DIR}
app.generation.free-limit=${FREE_GENERATION_LIMIT:3}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.cookie.secure=true
app.cookie.same-site=Strict
app.rate-limit.trust-forwarded-headers=${TRUST_FORWARDED_HEADERS:true}
server.forward-headers-strategy=FRAMEWORK

# A shorter grace period than prod, so the deletion purge can actually be exercised
# end to end without waiting a week for the assertion.
app.account.deletion-grace-period=${DELETION_GRACE_PERIOD:1h}

# --- the three deliberate differences from prod ---
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
logging.level.com.careerplatform=DEBUG
management.endpoint.health.show-details=always

logging.structured.format.console=ecs
logging.level.root=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF

management.server.address=${MANAGEMENT_BIND_ADDRESS:127.0.0.1}

server.error.include-stacktrace=never
server.error.include-message=never
server.shutdown=graceful
