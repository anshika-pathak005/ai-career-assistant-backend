spring.application.name=career-assistant

# ===============================
# PROFILE
# ===============================
# DEFAULT, not ACTIVE. This was spring.profiles.active=local, which is baked into the jar
# and therefore ships to production - where it would be silently overridden by
# SPRING_PROFILES_ACTIVE if someone remembered, and quietly run the LOCAL profile if they
# did not. That means ddl-auto=update, show-sql=true and Swagger UI on a public box.
#
# spring.profiles.default applies only when nothing else is set, so `./mvnw spring-boot:run`
# still picks up application-local.properties, and a deployment that sets
# SPRING_PROFILES_ACTIVE=prod is not fighting a value compiled into the artifact.
spring.profiles.default=local

#database configuration
# ===============================
# DATABASE CONFIG (used in local file)
# ===============================
# spring.datasource.url=
# spring.datasource.username=
# spring.datasource.password=
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA CONFIG
# ===============================
# validate, not update. Every profile now states its own value explicitly
# (local overrides this back to update) so that no environment can inherit schema
# modification rights by accident.`validate` will fail against an empty database,
# which is the correct behaviour and also
# the reason migrations are now the blocking item before any real deploy.
spring.jpa.hibernate.ddl-auto=validate
# show-sql is synchronous console I/O on every statement and it prints bound
# parameter values, which on this app means emails and resume filenames in the log.
# Left on because this profile is local-only and the verification steps need it.
# It must be false in any deployed profile.
spring.jpa.show-sql=false
jwt.refresh-expiration-days=7


# File upload config
#file.upload-dir=
#file.allowed-types=
#spring.servlet.multipart.max-file-size=
#spring.servlet.multipart.max-request-size=


## ===============================
## GROQ AI API
## ===============================
#groq.api.key=${GROQ_API_KEY}
#groq.api.url=https://api.groq.com/openai/v1/chat/completions
#groq.api.model=llama-3.3-70b-versatile

# ===============================
# GENERATION LIMITS
# ===============================
# app.generation.free-limit=

# ===============================
# GROQ RESUME API (separate account)
# ===============================
#groq.resume.api.key=${GROQ_RESUME_API_KEY}
#groq.resume.api.url=https://api.groq.com/openai/v1/chat/completions
#groq.resume.api.model=llama-3.3-70b-versatile

# ===============================
# RATE LIMITING
# ===============================
# Whether to trust the X-Forwarded-For header when identifying the client.
#
# Leave FALSE when the app is directly reachable. X-Forwarded-For is supplied by the
# client, so if nothing strips it an attacker sends a new value per request, every
# request looks like a new client, and rate limiting never fires.
#
# Set TRUE only when a proxy you control (ALB / Nginx / Cloudflare) OVERWRITES the
# header before the request reaches this app.
app.rate-limit.trust-forwarded-headers=false

# ===============================
# JWT
# ===============================
# jwt.secret and jwt.expiration live in application-local.properties / the environment.
#
# jwt.secret MUST be at least 32 bytes (256 bits) for HS256. This is checked at startup
# and the app refuses to boot if it is short or missing.
# Generate one with:  openssl rand -base64 48
#
# issuer and audience are stamped on every token and required when parsing, so a token
# minted by another environment sharing the same secret is not accepted here.
jwt.issuer=career-assistant
jwt.audience=career-assistant-web

# ===============================
# REFRESH TOKEN COOKIE
# ===============================
# Secure defaults to TRUE. A Secure cookie is NOT stored by the browser over plain http,
# so LOCAL DEV OVER http NEEDS app.cookie.secure=false in application-local.properties.
#
# Symptom if you forget: login returns 200 and looks fine, then every /api/auth/refresh
# returns 401 because the cookie was never stored.
app.cookie.secure=true

# SameSite is load-bearing, not decoration. CSRF protection is disabled in SecurityConfig
# and /api/auth/refresh accepts this cookie, so Strict is the only thing stopping another
# origin from forcing a token rotation. Do not relax without adding CSRF tokens.
app.cookie.same-site=Strict

# Nightly deletion of long-expired refresh token rows. Rotation marks rows revoked rather
# than deleting them (that is what makes reuse detection work), so this is what keeps the
# table bounded. Requires @EnableScheduling on CareerAssistantApplication.
app.refresh-token.purge-cron=0 30 3 * * *

# ===============================
# ACCOUNT DELETION
# ===============================
# How long a deletion request sits pending before the data is actually destroyed.
#
# Deletion is no longer immediate: DELETE /api/v1/user/settings/account now returns 202
# with the scheduled date, and the user can cancel until it passes. The window is the
# whole control - it does not make the password stronger, it makes the outcome reversible.
#
# Shortening this to zero restores the old behaviour, which is not recommended; lengthening
# it past a couple of weeks makes "delete my account" a misleading thing to have clicked.
app.account.deletion-grace-period=7d

# When the purge job sweeps for expired grace periods. Requires @EnableScheduling, which
# CareerAssistantApplication already has.
app.account.purge-cron=0 0 4 * * *

# ===============================
# CORS
# ===============================
# Browser origins allowed to call this API. Add your own dev machine's origin in
# application-local.properties rather than here, so it does not ship in the jar.
app.cors.allowed-origins=http://localhost:3000,http://localhost:8080

# ===============================
# GENERATION QUOTA
# ===============================
# Timezone the monthly quota reset is anchored to. MUST match where your users are, not
# where the server runs - the JVM default would reset Indian users at 5:30am on the 1st
# in a UTC container.
app.generation.reset-zone=Asia/Kolkata

# ===============================
# UPLOAD LIMITS
# ===============================
# Spring buffers the ENTIRE multipart body before any controller code runs, so this is
# the limit that actually fires first - FileStorageService's own 5MB check happens too
# late to prevent the memory being used. Keep the two in step.
# Exceeding this returns 413.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# FileStorageService's own limit (6.4). Must agree with max-file-size above. The multipart
# limit is the one that fires first and returns 413; this one is the in-code backstop.
file.max-size=5MB

# ===============================
# PERSISTENCE
# ===============================
# open-in-view defaults to TRUE, which keeps the Hibernate session open for the whole
# request including response rendering, holding a connection longer than needed.
#
# TURNING THIS OFF MAY SURFACE LazyInitializationException in places that currently work
# by accident. Fix each one with an explicit fetch join rather than turning this back on.
spring.jpa.open-in-view=false

# ===============================
# ERROR HANDLING  (6.5)
# ===============================
# Both are required for NoHandlerFoundException to reach GlobalExceptionHandler. Without
# add-mappings=false the static resource handler matches every unmatched path, so the
# exception is never thrown and an unknown URL returns Spring's HTML error page from a
# JSON API.
spring.web.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=true

# Never leak stack traces or internal messages to clients. GlobalExceptionHandler builds
# every error body; these switch off Spring's own error attributes as a backstop.
server.error.include-stacktrace=never
server.error.include-message=never

# ===============================
# LOGGING  (6.5)
# ===============================
# Puts the correlation id from RequestIdFilter on every log line. The same id is returned
# on the X-Request-Id header and in the error body, so a user reporting "I got a 500" can
# quote something you can actually grep for.
logging.pattern.level=%5p [%X{requestId:-no-request-id}] [user:%X{userId:-anonymous}]

# ===============================
# ACTUATOR / METRICS  
# ===============================
# SEPARATE PORT. /actuator is not behind the security filter chain when it runs on its own
# port - Spring Security is registered in the main servlet context only - so this port must
# not be publicly reachable. Bind it to the internal interface and scrape it from inside
# the network; do NOT publish 9090 in your compose file or your ingress.
management.server.port=9091

# Only what is actually needed. The default is /health alone; the default for a careless
# deployment is `*`, which exposes /env, /configprops, /beans and (until you turn it off)
# a heap dump containing every secret the process has read.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoints.web.exposure.exclude=env,configprops,beans,heapdump,threaddump

# Details on the internal port only. Even there this is a judgement call: health details
# name the database and the upload path.
management.endpoint.health.show-details=when_authorized
management.endpoint.health.show-components=always

# Kubernetes probes. The groups name their members EXPLICITLY rather than including
# everything, and that is the whole point:
#
#   liveness  = is this JVM wedged? Restarting fixes that and nothing else. If the
#               database or Groq were in here, an outage in either would make Kubernetes
#               kill every pod in a loop, turning someone else's incident into ours.
#   readiness = can this instance serve a request? The database is in here, because
#               without it almost every endpoint 500s. Groq and the upload directory are
#               NOT - roadmap generation failing is not a reason to take the whole
#               instance out of the load balancer.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState,ping
management.endpoint.health.group.readiness.include=readinessState,db

# DEGRADED is GroqHealthIndicator's custom status: worth alerting on, not worth failing a
# probe for. It must be in the order list or Spring cannot rank it, and it must be mapped
# to 200 or an aggregate containing it returns 503.
management.endpoint.health.status.order=DOWN,OUT_OF_SERVICE,DEGRADED,UNKNOWN,UP
management.endpoint.health.status.http-mapping.DEGRADED=200

# Tags applied to every metric. Without `application`, two services scraped into one
# Prometheus are indistinguishable.
management.metrics.tags.application=${spring.application.name}

# Histogram buckets for HTTP server latency, so p95/p99 are computable in Prometheus
# rather than pre-aggregated per instance (an average of averages is not an average).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,500ms,1s,5s,30s

# ===============================
# SUPABASE STORAGE
# ===============================
# Supabase Storage configuration for resume file storage.
# URL: https://fkthyogkozhpwqoygqth.supabase.co
# Bucket: careerPilot_resumes (private)
# Secret key must be provided via environment or profile-specific properties.
# Note: supabase.secret-key is required for the app to start.
supabase.url=https://fkthyogkozhpwqoygqth.supabase.co
supabase.bucket=careerPilot_resumes

# ===============================
# OPENAPI
# ===============================
# springdoc serves /v3/api-docs and /swagger-ui.html. They are permitAll in SecurityConfig
# so they work in development. TURN THEM OFF IN ANY DEPLOYED PROFILE - an OpenAPI document
# is a complete map of your API surface, handed to anyone who asks.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Enable ConfigurationProperties
# Enable configuration properties bean scanning
spring.config.import=optional:file:.env[.properties]
# Property binding for SupabaseStorageProperties
spring.main.allow-bean-definition-overriding=true
