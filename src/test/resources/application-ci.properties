# ============================================================================
# CI PROFILE (7.4) — used by .github/workflows/ci.yml against a MySQL service container.
#
# Since 6.4 the app refuses to start without jwt.secret, both Groq endpoints,
# file.upload-dir, app.generation.free-limit and app.cors.allowed-origins. That is
# correct behaviour and it means @SpringBootTest cannot boot without all of them — so
# this file exists to supply throwaway values, not to weaken the checks.
#
# Nothing here is secret. Everything is either a throwaway or points at a black hole.
# ============================================================================

# Defaults so `./mvnw verify` works on a developer machine with a local MySQL and no
# environment variables set. CI overrides all three (see .github/workflows/ci.yml).
# A test suite that only runs in CI is one nobody runs before pushing.
spring.datasource.url=${CI_DB_URL:jdbc:mysql://localhost:3306/career_assistant_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${CI_DB_USERNAME:root}
spring.datasource.password=${CI_DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# create-drop, not validate: there are still no Flyway migrations (plan item 0.4), so
# Hibernate generating the schema is the only way this runs at all. That is a stopgap and
# it has a real cost — CI is testing against a schema Hibernate invented rather than the
# one production will have, which is precisely the drift `validate` is meant to catch.
# When migrations land, switch this to validate and run Flyway first.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# 32+ bytes or JwtUtil refuses to start.
jwt.secret=${CI_JWT_SECRET:ci-only-secret-value-at-least-32-bytes-long}
jwt.expiration=3600000

# 127.0.0.1:1 refuses connections instantly. Deliberate: if a test ever reaches the AI
# path unmocked, it fails immediately and loudly rather than hanging for the 60s read
# timeout, and it can never spend real quota or leak a prompt to a third party.
groq.api.key=ci-not-a-real-key
groq.api.url=http://127.0.0.1:1/v1/chat/completions
groq.api.model=ci-model
groq.resume.api.key=ci-not-a-real-key
groq.resume.api.url=http://127.0.0.1:1/v1/chat/completions
groq.resume.api.model=ci-model

file.upload-dir=${java.io.tmpdir}/career-assistant-ci-uploads
app.generation.free-limit=3
app.cors.allowed-origins=http://localhost:3000
app.cookie.secure=false
# One hour, not one second. AccountDeletionLifecycleTest backdates the request timestamp
# to make an account due, rather than sleeping — so the grace period only has to be long
# enough that a NOT-yet-due account stays not-due for the length of the suite. At 1s,
# purgeSweepIgnoresPendingAccounts would race the clock and fail intermittently.
app.account.deletion-grace-period=1h

# The scheduled jobs must not fire during a test run — a purge racing an assertion is an
# intermittent failure that takes a day to diagnose. Both crons are pushed to 29 February.
app.account.purge-cron=0 0 0 29 2 ?
app.refresh-token.purge-cron=0 0 0 29 2 ?

# Actuator on the main port in tests; a second port complicates @SpringBootTest for no gain.
management.server.port=-1
springdoc.api-docs.enabled=false
logging.level.root=WARN
logging.level.com.careerplatform=INFO
